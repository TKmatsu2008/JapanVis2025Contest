<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>東京メトロ ネットワーク図</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="legend">
    <div class="legend-group-title">東京メトロ</div>
    <div class="legend-item"><span class="color" style="background:#FF9500"></span>銀座線</div>
    <div class="legend-item"><span class="color" style="background:#F62E36"></span>丸ノ内線</div>
    <div class="legend-item"><span class="color" style="background:#B5B5AC"></span>日比谷線</div>
    <div class="legend-item"><span class="color" style="background:#009BBB"></span>東西線</div>
    <div class="legend-item"><span class="color" style="background:#00BB85"></span>千代田線</div>
    <div class="legend-item"><span class="color" style="background:#C1A470"></span>有楽町線</div>
    <div class="legend-item"><span class="color" style="background:#8F76D6"></span>半蔵門線</div>
    <div class="legend-item"><span class="color" style="background:#00AC9B"></span>南北線</div>
    <div class="legend-item"><span class="color" style="background:#9C5E31"></span>副都心線</div>
  
    <div class="legend-group-title">都営地下鉄</div>
    <div class="legend-item"><span class="color" style="background:#CF3366"></span>大江戸線</div>
    <div class="legend-item"><span class="color" style="background:#FF535F"></span>浅草線</div>
    <div class="legend-item"><span class="color" style="background:#0067B0"></span>三田線</div>
    <div class="legend-item"><span class="color" style="background:#9FB01C"></span>新宿線</div>
  </div>
  <div id="grid-container">
    <div class="map-cell"><div class="mapbox" id="map-早朝"></div><div class="label">early morning</div></div>
  </div>
  <script defer src="main.js"></script>
</body>
</html>
