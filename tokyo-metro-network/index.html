<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>東京メトロ ネットワーク図</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <link rel="stylesheet" href="style.css">

  <script defer src="main.js"></script>
</head>
<body>
  <div id="grid-container">
    <div class="map-cell"><div class="mapbox" id="map-早朝"></div><div class="label">早朝</div></div>
    <div class="map-cell"><div class="mapbox" id="map-朝"></div><div class="label">朝</div></div>
    <div class="map-cell"><div class="mapbox" id="map-日中"></div><div class="label">日中</div></div>
    <div class="map-cell"><div class="mapbox" id="map-夕方"></div><div class="label">夕方</div></div>
    <div class="map-cell"><div class="mapbox" id="map-夜"></div><div class="label">夜</div></div>
    <div class="map-cell"><div class="mapbox" id="map-深夜"></div><div class="label">深夜</div></div>
  </div>
  <script defer src="main.js"></script>
</body>
</html>
